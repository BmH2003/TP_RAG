[project]
name = "tp-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BmH2003", email = "BENMOUSSA.Hafid@usms.ac.ma" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.9.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "msvc-runtime>=14.44.35112",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
tp-rag = "tp_rag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
